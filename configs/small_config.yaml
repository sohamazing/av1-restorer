# ==============================================================================
# AV1-Restorer: Professional Training Configuration 
# ==============================================================================

# --- Project & Experiment Tracking ---
project:
  name: "AV1-Compression-Artifact-Restorer"
  experiment_name: "AV1-Restorer-Small"
  log_to_wandb: true

# --- Data Paths ---
data:
  train_lq_root: "~/Documents/aura/av1_data/train/lq"
  train_hq_root: "~/Documents/aura/av1_data/train/hq"
  val_lq_root: "~/Documents/aura/av1_data/val/lq"
  val_hq_root: "~/Documents/aura/av1_data/val/hq"
  hq_ext: ".png"
  lq_ext: ".avif"

# --- Dataset Settings ---
dataset:
  crf_range: [23, 63]
  preset_range: [4, 4] # Train only on preset 4 for now
  norm_range: [-1,1] # Options: '[-1,1]' or '[0,1]'

# --- Training Strategy ---
curriculum:
  # Smoother curriculum: Add intermediate size
  patch_sizes: [128, 192, 256] # Progressively train on larger image patches
  batch_sizes: [64, 32, 16] # Adjust based on VRAM for each patch size
  epochs_per_stage: [60, 50, 40]  # Total 150 epochs

# --- Model Architecture (AV1UNetRestorer) ---
model:
  size: "small" # Options: "tiny", "small", "base", "large"

  tiny:   # ~4M params
    channels: [24, 48, 64, 128, 256] # [24, 48, 64, 128, 256]
    blocks: [2, 2, 2, 2, 4]

  small:  # ~10M params
    channels: [20, 40, 80, 160, 320]
    blocks: [2, 2, 3, 3, 6]

  base:   # ~16M params
    channels: [48, 64, 128, 224, 384]
    blocks: [2, 2, 3, 3, 6]

  large:  # ~32M params
    channels: [64, 96, 128, 256, 512]
    blocks: [2, 3, 4, 4, 8]


# --- Loss Function (Configures the `CombinedLoss` class) ---
loss:
  l1:
    enabled: true
    weight: 1.0
    params:
      eps: 0.001 # Epsilon for Charbonnier L1 smoothness

  perceptual:
    enabled: true
    weight: 0.1
    params:
      network: 'vgg' # 'vgg' (faster) or 'lpips' (often better quality)

  ms_ssim:
    enabled: true # Enable for better structural similarity (only for patch > 160px)
    weight: 0.2
    params: {}

  frequency:
    enabled: true # Enable to focus on high-frequency details (textures/edges)
    weight: 0.05
    params:
      alpha: 0.8 # 1.0 focuses on magnitude; 0.5 on both magnitude & phase

# --- Optimization ---
optimizer:
  type: "adamw"      # 'adamw' is generally recommended
  lr: 5.0e-5 # 2.0e-4         # Learning rate
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  use_ema: true      # Use Exponential Moving Average for stabler weights

scheduler:
  type: "cosine"     # Cosine annealing schedule
  min_lr: 1.0e-6

# --- Training Process ---
training:
  grad_clip_norm: 1.0
  validate_every_n_epochs: 1
  num_val_samples_to_log: 4

# --- Checkpointing ---
checkpoint:
  dir: "./checkpoints/av1-restorer-small/"
  save_every_n_epochs: 1

# --- System & Performance ---
system:
  num_workers: 8
  device: "auto"             # "cuda", "mps", or "cpu"
  mixed_precision: false     # Recommended for NVIDIA/Apple GPUs
  seed: 8
