# configs/unet_crf_curriculum.yaml
# --- Project & Experiment Tracking ---
project:
  name: "AV1-Restorer-Curriculum"
  experiment_name: "UNet-Base-CRF-Progressive"
  log_to_wandb: true

# --- Data Paths ---
data:
  train_lq_root: "av1_data/train/lq"
  train_hq_root: "av1_data/train/hq"
  val_lq_root: "av1_data/val/lq"
  val_hq_root: "av1_data/val/hq"
  hq_ext: ".png"
  lq_ext: ".avif" # Using .avif for the standard (slower) dataset

# --- Dataset Settings ---
dataset:
  # This is the GLOBAL default.
  # The curriculum stages will OVERRIDE this.
  crf_range: [23, 63]
  preset_range: [0, 8] # Train on all presets
  norm_range: [-1, 1]

# --- Model Architecture ---
model:
  type: "unet"  # <-- KEY: Must be the conditional "unet" for this to work
  size: "base"  # 'tiny', 'small', 'base', 'large'

# --- Training Strategy (3-Stage CRF Curriculum) ---
curriculum:
  # Stage 1: Learn to fix MOST severe artifacts
  # Uses small patches to learn basic features quickly.
  - patch_size: 128
    batch_size: 32
    epochs: 40
    crf_range: [44, 63] # <-- STAGE 1 OVERRIDE

  # Stage 2: Learn to fix MODERATE artifacts
  # Increases patch size to see more context.
  - patch_size: 256
    batch_size: 16
    epochs: 60
    crf_range: [34, 43] # <-- STAGE 2 OVERRIDE

  # Stage 3: Learn to fix LEAST severe artifacts
  # Masters the fine details with full patch size.
  - patch_size: 256
    batch_size: 16
    epochs: 50
    crf_range: [23, 33] # <-- STAGE 3 OVERRIDE

# --- Loss Function ---
loss:
  charbonnier: { enabled: true, weight: 1.0, params: { eps: 0.001 } }
  perceptual: { enabled: true, weight: 0.1, params: { network: 'vgg' } }
  ms_ssim: { enabled: true, weight: 0.5 }
  frequency: { enabled: true, weight: 0.05, params: { alpha: 0.8 } }

# --- Optimization ---
optimizer:
  type: "adamw"
  lr: 2.0e-4
  weight_decay: 1.0e-4
  use_ema: true

scheduler:
  type: "cosine"
  min_lr: 1.0e-6
  warmup_steps: 1000

# --- Training Process ---
training:
  grad_clip_norm: 1.0
  validate_every_n_epochs: 1
  num_val_samples_to_log: 4

# --- Checkpointing ---
checkpoint:
  dir: "./checkpoints/unet-base-crf-curriculum/"
  save_every_n_epochs: 5

# --- System & Performance ---
system:
  num_workers: 8
  device: "auto" # 'cuda', 'mps', or 'auto'
  mixed_precision: true
  seed: 42