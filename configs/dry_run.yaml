# ==============================================================================
# AV1-Restorer: Professional Training Configuration (dry run)
# ==============================================================================

# --- Project & Experiment Tracking ---
project:
  name: "AV1-Compression-Artifact-Restorer"
  experiment_name: "AV1-Restorer-Dry"
  log_to_wandb: true

# --- Data Paths (UPDATE THESE) ---
data:
  train_lq_root: "~/Documents/aura/av1_data/train/lq"
  train_hq_root: "~/Documents/aura/av1_data/train/hq"
  val_lq_root: "~/Documents/aura/av1_data/val/lq"
  val_hq_root: "~/Documents/aura/av1_data/val/hq"
  hq_ext: ".png"
  lq_ext: ".avif"

# --- Dataset Settings ---
dataset:
  crf_range: [23, 63]
  preset_range: [4, 4] 
  norm_range: [-1, 1]

# --- Training Strategy ---
curriculum:
  patch_sizes: [128]
  batch_sizes: [32]
  epochs_per_stage: [1]

# --- Model Architecture (AV1UNetRestorer) ---
model:
  size: "small" # Options: "tiny", "small", "base", "large"

  tiny:   # ~4M params
    channels: [24, 48, 64, 128, 224]
    blocks: [2, 2, 2, 2, 4]

  small:  # ~10M params
    channels: [20, 40, 80, 160, 320]
    blocks: [2, 2, 3, 3, 6]

  base:   # ~16M params
    channels: [48, 64, 128, 224, 384]
    blocks: [2, 2, 3, 3, 6]

  large:  # ~32M params
    channels: [64, 96, 128, 256, 512]
    blocks: [2, 3, 4, 4, 8]

# --- Loss Function (Configures the `CombinedLoss` class) ---
loss:
  l1:
    enabled: true
    weight: 1.0
    params:
      eps: 0.001

  perceptual:
    enabled: true
    weight: 0.1
    params:
      network: 'vgg'

  ms_ssim:
    enabled: false
    weight: 0.5
    params: {}

  frequency:
    enabled: false
    weight: 0.05
    params:
      alpha: 1.0

# --- Optimization ---
optimizer:
  type: "adamw"
  lr: 2.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

training:
  use_ema: true
  grad_clip_norm: 1.0
  validate_every_n_epochs: 1
  num_val_samples_to_log: 4

scheduler:
  type: "cosine" # onecycle
  min_lr: 1.0e-6

# --- Checkpointing ---
checkpoint:
  dir: "./checkpoints/av1-restorer-v1/"
  save_every_n_epochs: 1

# --- System & Performance ---
system:
  num_workers: 8
  device: "mps"
  mixed_precision: false
  seed: 8