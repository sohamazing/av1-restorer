# configs/train_fast_restorer.yaml
# ==============================================================================
# AURA-Net: Ultra-Fast Restorer Training Configuration
# ==============================================================================

project:
  name: "AURA-Net-Restorer"
  experiment_name: "AV1-Fast-Restorer-v1"
  log_to_wandb: true

data:
  train_lq_root: "/Users/soham/Documents/aura/av1_dataset/train"
  train_hq_root: "/Users/soham/Desktop/Photos/Div2K/DIV2K_train_HR"
  val_lq_root: "/Users/soham/Documents/aura/av1_dataset/val"
  val_hq_root: "/Users/soham/Desktop/Photos/Div2K/DIV2K_train_HR"
  hq_ext: ".png"

dataset:
  crf_range: [23, 63]
  preset_range: [0, 8]

curriculum:
  patch_sizes: [128, 256]
  batch_sizes: [64, 32] # Can use larger batches for this small model
  epochs_per_stage: [80, 120]

# --- Model Architecture (AV1FastRestorer) ---
model:
  name: "AV1FastRestorer" # Specifies which model class to load
  params:
    base_channels: 48
    num_blocks: 8

# --- Loss Function (Configures the `CombinedLoss` class) ---
loss:
  l1:
    enabled: true
    weight: 1.0
    params: { eps: 0.001 }
  perceptual:
    enabled: true
    weight: 0.1
    params: { network: 'vgg' }

# --- Optimization & Training ---
optimizer:
  type: "adamw"
  lr: 3.0e-4 # Can often use a slightly higher LR for smaller models
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  use_ema: true

scheduler:
  type: "cosine"
  min_lr: 1.0e-6

training:
  grad_clip_norm: 1.0
  validate_every_n_epochs: 1
  num_val_samples_to_log: 4

checkpoint:
  dir: "./checkpoints/aura-net-fast-v1/"
  save_every_n_epochs: 5

system:
  num_workers: 8
  device: "mps"
  mixed_precision: true
  seed: 42