# ==============================================================================
# Production Configuration - Conditional U-Net Trainer (Legacy v2.1)
# ==============================================================================
# Purpose: Train universal conditional AV1UNetRestorer (handles all CRFs)
# Usage:   python train_av1_restorer.py --config configs/conditional_unet_config.yaml
#
# Model Characteristics:
#   • Conditional on CRF and Preset (FiLM modulation)
#   • Single model handles entire CRF range 23-63
#   • Larger than nano variants but more flexible
#   • Best quality but slower inference (15-30 fps @ 1080p)
#
# Use Cases:
#   ✓ Unknown or variable CRF at inference time
#   ✓ Need single universal model (deployment simplicity)
#   ✓ Quality is more important than speed
#
# Training Time (RTX 3060):
#   tiny:  4-6 hours
#   small: 8-12 hours
#   base:  16-24 hours
#   large: 32-48 hours
# ==============================================================================

# ------------------------------------------------------------------------------
# Project & Logging
# ------------------------------------------------------------------------------
project:
  name: "AV1-Conditional-UNet"
  experiment_name: "conditional_unet_base_fullrange"
  log_to_wandb: true  # Recommended for long training runs

# ------------------------------------------------------------------------------
# Data Paths
# ------------------------------------------------------------------------------
data:
  # Training data (1000-3000 images recommended for universal model)
  train_lq_root: "~/av1_data/train/lq"
  train_hq_root: "~/av1_data/train/hq"
  
  # Validation data (200-500 images recommended)
  val_lq_root: "~/av1_data/val/lq"
  val_hq_root: "~/av1_data/val/hq"
  
  # File formats
  lq_ext: ".avif"  # Use .npy for faster loading if available
  hq_ext: ".png"
  # lq_ext: ".npy"
  # hq_ext: ".npy"

# ------------------------------------------------------------------------------
# Dataset Parameters
# ------------------------------------------------------------------------------
dataset:
  # Full CRF range (conditional model learns to handle all)
  crf_range: [23, 63]
  
  # Multiple presets optional (increases training data diversity)
  preset_range: [4, 4]    # Single preset (simpler)
  # preset_range: [2, 6]  # Multiple presets (more robust)
  
  norm_range: [-1, 1]

# ------------------------------------------------------------------------------
# Training Curriculum (Legacy Format: Parallel Lists)
# ------------------------------------------------------------------------------
# Each list index = one curriculum stage
# All lists must have the same length
curriculum:
  # Progressive patch sizes
  patch_sizes: [128, 256, 512]
  
  # Corresponding batch sizes (adjust for your GPU VRAM)
  # 128px: 32-64 batch (8-12GB VRAM)
  # 256px: 12-24 batch (8-12GB VRAM)
  # 512px: 4-8 batch (8-12GB VRAM)
  batch_sizes: [32, 16, 8]
  
  # Epochs per stage
  epochs_per_stage: [100, 150, 50]
  
  # Example for 2-stage training (faster):
  # patch_sizes: [256, 512]
  # batch_sizes: [16, 8]
  # epochs_per_stage: [150, 50]

# ------------------------------------------------------------------------------
# Model Configuration
# ------------------------------------------------------------------------------
model:
  # Size options and parameter counts:
  #   tiny:  ~4M params  - Fast prototyping, mobile
  #   small: ~10M params - Balanced (recommended starting point)
  #   base:  ~16M params - High quality (recommended for production)
  #   large: ~32M params - Best quality, slow inference
  size: "base"

# ------------------------------------------------------------------------------
# Loss Functions
# ------------------------------------------------------------------------------
loss:
  # Primary pixel loss (REQUIRED)
  charbonnier:
    enabled: true
    weight: 1.0
    params: {eps: 0.001}
  
  # Perceptual loss (HIGHLY RECOMMENDED for conditional models)
  perceptual:
    enabled: true
    weight: 0.01
    params:
      network: 'vgg'  # 'vgg' or 'lpips'
  
  # Multi-scale SSIM (OPTIONAL, helps with structural quality)
  ms_ssim:
    enabled: false   # Enable if patch_size ≥ 224
    weight: 0.1
    params: {}
  
  # Frequency loss (OPTIONAL, enhances texture/edge detail)
  frequency:
    enabled: false
    weight: 0.05
    params:
      alpha: 1.0     # 1.0 = magnitude, 0.5 = magnitude+phase
  
  # Standard L1/L2 (usually not needed)
  l1:
    enabled: false
    weight: 1.0
    params: {}
  
  l2:
    enabled: false
    weight: 1.0
    params: {}

# ------------------------------------------------------------------------------
# Optimizer
# ------------------------------------------------------------------------------
optimizer:
  type: "adamw"
  lr: 1.0e-4              # Conservative LR for large model
  # lr: 2.0e-4            # Can increase for faster convergence
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

# ------------------------------------------------------------------------------
# Learning Rate Scheduler
# ------------------------------------------------------------------------------
scheduler:
  type: "cosine"          # Cosine annealing (recommended)
  # type: "onecycle"      # Alternative: OneCycle (faster convergence)
  # type: "none"          # No scheduling
  min_lr: 1.0e-6

# ------------------------------------------------------------------------------
# Training Loop (Legacy Format)
# ------------------------------------------------------------------------------
training:
  grad_clip_norm: 1.0                # Gradient clipping (stability)
  validate_every_n_epochs: 5         # Less frequent for long training
  num_val_samples_to_log: 4          # W&B visual samples
  
  # EMA settings (under 'training' in old script format)
  use_ema: true
  ema_decay: 0.9999

# ------------------------------------------------------------------------------
# Checkpointing
# ------------------------------------------------------------------------------
checkpoint:
  dir: "./checkpoints/conditional_unet_base_fullrange/"
  save_every_n_epochs: 10  # Periodic saves (long training = more frequent)

# ------------------------------------------------------------------------------
# System Configuration
# ------------------------------------------------------------------------------
system:
  num_workers: 8          # Data loading parallelism
  device: "auto"          # cuda > mps > cpu
  # device: "cuda"
  mixed_precision: true   # Essential for large models
  seed: 42

# ==============================================================================
# Training Strategy for Conditional U-Net
# ==============================================================================
#
# 1. Why Use Conditional U-Net?
#    • Single model handles CRF 23-63 (no need for multiple models)
#    • More data-efficient (learns cross-CRF patterns)
#    • Flexible at inference (can adapt to any CRF)
#    • Best for research or when CRF is unknown
#
# 2. Disadvantages vs Nano Models:
#    • Slower inference (15-30 fps vs 45-60 fps)
#    • Larger model size (16M vs 1.5M params)
#    • Longer training time (16-24h vs 4-6h)
#
# 3. Recommended Settings by Hardware:
#    
#    RTX 3060 (12GB VRAM):
#      size: "base"
#      batch_sizes: [32, 16, 8]
#      mixed_precision: true
#    
#    RTX 3070/3080 (8-10GB VRAM):
#      size: "large"
#      batch_sizes: [24, 12, 6]
#      mixed_precision: true
#    
#    Apple M1/M2 (Unified Memory):
#      size: "base"
#      batch_sizes: [16, 8, 4]
#      mixed_precision: true
#      device: "mps"
#
# 4. Monitoring Training:
#    • Watch CRF distribution in validation (should be uniform)
#    • Check that model improves across all CRF ranges
#    • Validation L1 improvement: 40-70% (higher than nano)
#    • Use W&B to track per-CRF performance
#
# 5. Hyperparameter Tuning:
#    • If model overfits: increase weight_decay (1e-4 → 5e-4)
#    • If slow convergence: increase LR (1e-4 → 2e-4)
#    • If quality plateaus: add frequency or MS-SSIM loss
#    • If training unstable: decrease LR, increase grad_clip_norm
#
# 6. Resume Training:
#    python train_av1_restorer.py --config this_config.yaml --resume best --wand_id xxxxxx
# ==============================================================================